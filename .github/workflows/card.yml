name: Redraw README card

on:
  schedule:
    - cron: "17 */6 * * *"
  # The Mac pushes fresh token/language numbers into data/; redraw right away
  push:
    branches: [main]
    paths: ["data/**", "scripts/build_card.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-card
  cancel-in-progress: false

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Render card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_card.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card.svg
          git diff --staged --quiet && exit 0
          # GitHub caches README images hard; a new query string forces a refetch
          sed -i -E "s|(assets/card\.svg)(\?t=[0-9]+)?|\1?t=$(date +%s)|" README.md
          git add README.md
          git commit -m "Redraw README card"
          git pull --rebase
          git push
